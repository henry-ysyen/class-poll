<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投影</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="screen">
<div id="app"><div class="wait">載入中…</div></div>
<script type="module">
import { createStore, qs, el, $, optBadge, joinedSeats, timerLeft, fmtTime, tally, createImageCache } from './store.js';
import { SETS, DEFAULT_ROOM, setImages } from './questions.js';
import { brailleChart } from './braille.js';

const app = $('#app');
// 換整個畫面；null 的要先濾掉（replaceChildren 收到 null 會印出「null」三個字）
function show(...kids) { app.replaceChildren(...kids.filter((k) => k != null)); }
const room = qs('r', DEFAULT_ROOM);
main();

async function main() {
  const store = await createStore(room);
  let state = null, answers = {}, students = {}, unsubAns = null, lastSession = null;
  let timerEl = null; // 倒數數字：每半秒就地更新，不整頁重畫
  let picKey = '', picRetry = null; // 現在投影的是哪一張圖（同一張不重放）
  let qpic = null, qpicRetry = null; // 帶圖題目左邊那張圖（同一題重畫時沿用同一個元件，學生作答的更新不會讓圖閃）
  let tv = null; // 打字題的畫面（同一題只加新卡片，不整面重畫）
  // 帶圖題目排版的縮放順序（fitPic 用）：[圖的寬度 vw, 右欄縮放]。一定要在訂閱之前宣告：投影頁在老師停在帶圖題目時才打開，訂閱一掛上就會用到
  const FIT = [1, 0.9, 0.85, 0.8, 0.75, 0.7, 0.65, 0.6].flatMap((z) => [56, 50, 44, 40].map((w) => [w, z])).concat([[36, 0.6], [32, 0.6]]);
  // 繪本圖片的快取（要在訂閱之前宣告：訂閱一掛上就會畫畫面，老師若正停在圖片那一項就會用到）
  const caches = {}, preloading = {};
  const cacheFor = (set) => caches[set] || (caches[set] = createImageCache(store, set));
  // 視窗大小變了（投影那台把視窗拖到投影幕、按 F11）：帶圖的題目重新排一次
  window.addEventListener('resize', () => { const w = app.querySelector('.withpic'); if (w) fitPic(w); });
  setInterval(tick, 500);
  const base = location.href.replace(/[^/]*$/, '');
  const studentUrl = `${base}index.html${room === DEFAULT_ROOM ? '' : '?r=' + encodeURIComponent(room)}`;

  store.on('students', (s) => { students = s || {}; draw(); });
  store.on('state', (s) => {
    state = s;
    const session = s && s.session;
    if (session && session !== lastSession) {
      lastSession = session;
      if (unsubAns) unsubAns();
      unsubAns = store.on(`answers/${session}`, (a) => { answers = a || {}; draw(); });
    }
    draw();
  });

  function draw() {
    const SET = state && SETS[state.set];
    const q = SET && state.qid ? SET.questions.find((x) => x.id === state.qid) : null;
    const joinedList = state ? joinedSeats(students, state.session) : [];
    const joined = joinedList.length;
    const isPic = !!(q && q.type === 'pic');
    document.body.classList.toggle('nobar', !q || isPic); // 待機畫面、整面放圖都沒有底部提示條，不用留那 130px（720p 的封面畫面才放得下）
    document.body.classList.toggle('picmode', isPic);
    if (!isPic) picKey = '';
    if (!q || isPic || !q.img) qpic = null;
    if (!q || q.type !== 'text') tv = null;

    // 待機：掃碼畫面 或 平板蓋上
    if (!q) {
      if (state && state.screen === 'cover') return drawCover(joined);
      if (state && state.screen === 'intro' && SET && SET.cover) return drawIntro(SET.cover);
      return drawQr(joinedList, (state && state.n) || 30, SET ? SET.title : `教室 ${room}`);
    }
    if (q.type === 'slide') return drawSlide(q);
    if (q.type === 'pic') return drawPic(q);
    if (q.type === 'gallery') return drawGallery(q);

    const cur = answers[q.id] || {};
    const answered = Object.keys(cur).length;
    const pct = joined ? Math.round(answered / joined * 100) : 0;
    timerEl = state.timer ? el('div', { class: 'timer' }) : null;
    const top = el('div', { class: 'top' },
      el('div', { class: 'grow' }, el('div', { class: 'q-tag' }, q.tag || ''), el('div', { class: 'q-text' + (q.text.length > 26 ? ' long' : '') }, q.text)),
      el('div', { class: 'counter' },
        timerEl,
        el('div', {}, el('b', {}, answered), ` / ${joined} 已作答`),
        el('div', { class: 'progress' }, el('div', { class: 'fill', style: `width:${pct}%` })),
        el('div', { class: 'small-state' }, state.open ? '作答中' : '作答結束')),
    );
    tick();
    // 最下面一條指示（老婆要的：放大、上色，作答結束也一樣）
    const bar = hintbar(state.open
      ? (q.type === 'text' ? '在平板上打一句，按送出。' : q.type === 'multi' ? '可以選好幾個，點了就送出，再點一次取消。結果等老師公布。' : '在平板上選一個，點了就送出。結果等老師公布。')
      : '作答結束，眼睛看老師。', state.open);

    // 開放題：句子即時出現；老師在手機上點的那句放大在最上面
    if (q.type === 'text') return drawText(q, top, bar, cur);

    // 選擇題：結果公布前，投影只放題目、選項和人數
    if (!state.show) {
      put(q, [top, optionList(q)], bar);
      return;
    }
    if (q.compareWith) {
      const prev = SET.questions.find((x) => x.id === q.compareWith);
      const prevAns = answers[prev.id] || {};
      show(top, el('div', { class: 'compare' },
        el('div', {}, el('h3', {}, `${prev.tag || '前'}　${Object.keys(prevAns).length} 人`), bars(prev, prevAns)),
        el('div', {}, el('h3', {}, `${q.tag || '後'}　${answered} 人`), bars(q, cur)),
      ));
      return;
    }
    put(q, [top, bars(q, cur)]);
  }

  // 換畫面：沒帶圖的題目＝原本的 show；帶圖的題目（questions.js 的 img）＝左邊放圖、右邊放原本的內容，提示條照舊在最下面
  function put(q, kids, bar) {
    if (!q.img) { show(...kids, bar); return null; }
    const wrap = el('div', { class: 'withpic' }, picPanel(q), el('div', { class: 'qside' }, el('div', { class: 'qfit' }, kids)));
    show(wrap, bar);
    fitPic(wrap);
    return wrap;
  }
  // 右邊排不下（會超出畫面）：先把圖縮小（56→40vw），還不夠才把右邊整欄等比例縮小一點（字跟著小）、圖再從大的試起；
  // 最小到圖 32vw、字 6 成；再排不下就切掉最下面，不出捲軸。（FIT 宣告在 main 最上面：訂閱一掛上就會畫畫面）
  function fitPic(wrap) {
    const side = wrap.querySelector('.qside'), inner = side.firstChild;
    for (const [w, z] of FIT) {
      wrap.style.setProperty('--picw', w + 'vw');
      inner.style.zoom = z;
      if (inner.getBoundingClientRect().height <= side.clientHeight + 1) return;
    }
  }
  // 帶圖題目左邊那張圖：讀法、門禁、重試都跟整面放圖（drawPic）一樣；讀不到時只有這一塊顯示提示，右邊題目照常
  function picPanel(q) {
    const key = `${state.set}|${q.id}|${q.img}`;
    if (qpic && qpic.key === key) return qpic.node;
    const setId = state.set;
    const img = el('img', { class: 'pic-img', alt: '', style: 'visibility:hidden' });
    const msg = el('div', { class: 'pic-msg' }, '圖片載入中…');
    const node = el('div', { class: 'qpic' }, img, msg);
    qpic = { key, node };
    const alive = () => qpic && qpic.key === key;
    const tryLoad = () => cacheFor(setId).get(q.img).then((src) => {
      if (!alive()) return;
      img.src = src; img.style.visibility = ''; msg.remove();
      preloadSet(setId);
    }).catch((e) => {
      if (!alive()) return;
      msg.textContent = e.message === 'closed' ? '圖片還沒開放（老師頁再按一次這一項）' : '這張圖還沒上傳';
      clearTimeout(qpicRetry); qpicRetry = setTimeout(() => { if (alive()) tryLoad(); }, 3000);
    });
    tryLoad();
    return node;
  }

  // 打字題：同一題只換人數那一塊與提示條，新句子只加新的那一張卡（只有它跑進場動畫），已經在畫面上的卡不重畫；
  // 放大的那句換了才重做那一塊。換題、新回合才整面重畫。（11/12 上課時每進來一句整面重畫、每張卡重跑動畫，投影一直閃；11/16 修）
  function drawText(q, top, bar, cur) {
    const key = `${state.set}|${q.id}|${state.session}`;
    const items = Object.entries(cur).sort((a, b) => a[1].t - b[1].t);
    const spot = state.spot && cur[state.spot] ? cur[state.spot] : null;
    // 帶圖的題目右邊比較窄：句首（prefix）只在上面寫一次，卡片只放學生打的部分（放大的那句照舊整句）
    const short = !!(q.img && q.prefix);
    const cardText = (v) => (short && v.startsWith(q.prefix) ? v.slice(q.prefix.length) : v);
    if (!tv || tv.key !== key || !tv.top.isConnected) {
      tv = { key, top, bar, spotEl: null, spotKey: '', map: new Map(), wait: el('div', { class: 'wait' }, '等大家的句子……'), cards: el('div', { class: 'cards' }) };
      tv.wrap = put(q, [top, short ? el('div', { class: 'qprefix' }, q.prefix + '……') : null, tv.wait], bar);
    } else {
      tv.top.replaceWith(top); tv.top = top;
      tv.bar.replaceWith(bar); tv.bar = bar;
    }
    // 卡片：換過句子的（學生按「再送一次」，時間會變）拿掉重做；新的插在照時間排的位置，舊的不動
    const now = new Set(items.map(([seat]) => seat));
    for (const [seat, c] of tv.map) if (!now.has(seat) || c.t !== cur[seat].t) { c.node.remove(); tv.map.delete(seat); }
    let prev = null;
    for (const [seat, a] of items) {
      let c = tv.map.get(seat);
      if (!c) {
        c = { t: a.t, v: a.v, node: el('div', { class: 'cardt' }, cardText(a.v)) };
        tv.cards.insertBefore(c.node, prev ? prev.nextSibling : tv.cards.firstChild);
        tv.map.set(seat, c);
      } else if (c.v !== a.v) { c.v = a.v; c.node.textContent = cardText(a.v); }
      c.node.classList.toggle('spot', state.spot === seat);
      prev = c.node;
    }
    if (items.length && tv.wait.isConnected) tv.wait.replaceWith(tv.cards);
    else if (!items.length && tv.cards.isConnected) tv.cards.replaceWith(tv.wait);
    // 放大的那句（老師在手機上點的）：換了才重做
    const spotKey = spot ? `${state.spot}|${spot.v}` : '';
    if (spotKey !== tv.spotKey) {
      const node = spot ? el('div', { class: 'spotlight' }, spot.v) : null;
      if (tv.spotEl) { if (node) tv.spotEl.replaceWith(node); else tv.spotEl.remove(); }
      else if (node) (tv.cards.isConnected ? tv.cards : tv.wait).before(node);
      tv.spotEl = node; tv.spotKey = spotKey;
    }
    if (tv.wrap) fitPic(tv.wrap);
  }

  // 課文封面（題組有 cover 才有；11/12 Henry 定的流程）：上課一開始投影只放這張圖、平板還沒拿出來；老師按「開始互動式問卷」才換成掃碼畫面
  function drawIntro(cover) {
    show(el('div', { class: 'intro' }, el('img', { src: cover.image, alt: cover.title || '' })));
  }

  // 待機掃碼畫面
  function drawQr(joinedList, n, title) {
    const set = new Set(joinedList);
    const chips = el('div', { class: 'chips big' });
    for (let s = 1; s <= n; s++) chips.append(el('span', { class: 'chip' + (set.has(String(s)) ? ' done' : '') }, s));
    show(
      el('div', { class: 'top' }, el('h1', { style: 'font-size:34px' }, title), el('div', { class: 'counter' }, el('b', {}, joinedList.length), ' 人已加入')),
      el('div', { class: 'qr-wrap' },
        el('div', { id: 'qr' }),
        el('div', {},
          el('div', { class: 'step' }, '① 平板相機對準 QR code，點出現的網址'),
          el('div', { class: 'step' }, '② 按自己的座號'),
          el('div', { class: 'step' }, '③ 座號亮了，就把平板蓋上、眼睛看老師'),
          el('div', { class: 'hint', style: 'margin-top:20px' }, '掃不了就打網址：', el('code', { style: 'font-size:22px;word-break:break-all' }, studentUrl)),
        ),
      ),
      el('div', { style: 'margin-top:32px' }, el('div', { class: 'hint', style: 'margin:0 0 10px' }, '座號亮起來＝成功加入'), chips),
      store.mode === 'local' ? el('div', { class: 'hint' }, '（本機模式）') : null,
    );
    if (window.QRCode) new QRCode($('#qr'), { text: studentUrl, width: 320, height: 320 });
  }

  function drawCover(joined) {
    show(
      el('div', { class: 'cover' }, el('div', { class: 'cover-text' }, '請把平板蓋上'), el('div', { class: 'cover-sub' }, '眼睛看老師')),
      el('div', { class: 'corner' }, el('div', { id: 'qr' }), el('div', { class: 'hint', style: 'margin-top:6px;font-size:18px' }, `${joined} 人已加入`)),
    );
    if (window.QRCode) new QRCode($('#qr'), { text: studentUrl, width: 120, height: 120 });
  }

  // 揭曉頁（點字對照表）：先放整張讓學生自己找；老師按「顯示答案」才在今天摸的那幾格加黃框，提示條變綠色
  function drawSlide(q) {
    const on = !!state.show;
    const hl = q.highlight || [];
    show(
      el('div', { class: 'top' },
        el('div', { class: 'grow' }, el('div', { class: 'q-tag' }, q.tag || ''), el('div', { class: 'q-text' }, q.text)),
        el('div', { class: 'legend' }, '一格 6 個點位：左欄 1、2、3，右欄 4、5、6', el('br'), '黑點＝凸起　空圈＝沒有')),
      brailleChart({ highlight: hl, show: on }),
      hintbar(on ? `黃框＝今天摸的三張卡：${hl.join('、')}` : '找找看，你剛剛摸到的是哪一個數字？', true, on ? ' answer' : ''),
    );
  }

  // ---- 繪本圖片（圖放在資料庫，老師出這一項時才讀得到）----
  // 把這個題組的圖先抓好，帶讀時每一張都馬上出來
  function preloadSet(setId) {
    if (preloading[setId]) return;
    preloading[setId] = true;
    const ids = setImages(setId);
    cacheFor(setId).preload(ids).then((n) => { if (n < ids.length) preloading[setId] = false; });
  }
  // 整面放一張圖（老師帶讀）
  function drawPic(q) {
    const key = `${state.set}|${q.id}`;
    if (key === picKey) return; // 學生報到、作答的更新也會叫到這裡，同一張圖不要重放
    picKey = key;
    const setId = state.set;
    const img = el('img', { class: 'pic-img', alt: '', style: 'visibility:hidden' });
    const msg = el('div', { class: 'pic-msg' }, '圖片載入中…');
    show(el('div', { class: 'pic' }, img, msg, el('div', { class: 'pic-no' }, q.total ? `${+q.img} / ${q.total}` : q.img)));
    const tryLoad = () => cacheFor(setId).get(q.img).then((src) => {
      if (picKey !== key) return;
      img.src = src; img.style.visibility = ''; msg.remove();
      preloadSet(setId);
    }).catch((e) => {
      if (picKey !== key) return;
      msg.textContent = e.message === 'closed' ? '圖片還沒開放（老師頁再按一次這一項）' : '這張圖還沒上傳';
      clearTimeout(picRetry); picRetry = setTimeout(() => { if (picKey === key) tryLoad(); }, 3000);
    });
    tryLoad();
  }
  // 學生在平板上自己看圖的時候：投影只放指示和倒數
  function drawGallery(q) {
    timerEl = state.timer ? el('div', { class: 'timer' }) : null;
    show(
      el('div', { class: 'cover galwait' },
        el('div', { class: 'cover-text' }, '在平板上安靜看圖'),
        el('div', { class: 'cover-sub' }, `用手指左右滑，一共 ${(q.images || []).length} 張。不說話，慢慢看。`),
        timerEl),
      hintbar('時間到的時候，把平板蓋上，眼睛看老師。', true),
    );
    tick();
    preloadSet(state.set);
  }

  function hintbar(text, open, extra = '') { return el('div', { class: 'hintbar' + (open ? '' : ' closed') + extra }, text); }
  function tick() {
    if (!timerEl || !state || !state.timer) return;
    const left = timerLeft(state.timer);
    timerEl.textContent = left > 0 ? `⏱ ${fmtTime(left)}` : '時間到';
    timerEl.className = 'timer' + (left <= 10 ? ' urgent' : '') + (left === 0 ? ' over' : '');
  }

  function optionList(q) {
    const n = q.options.length;
    if (n > 4) return el('div', { class: 'opt-list many' }, q.options.map((opt) => el('div', { class: 'opt-big' }, opt))); // 多選項：小方塊排一排
    return el('div', { class: 'opt-list' }, q.options.map((opt, i) => { const b = optBadge(opt, i, n); return el('div', { class: 'opt-big' },
      el('span', { class: 'letter', style: `background:${b.bg};color:${b.ink}` }, b.label), el('span', {}, opt)); }));
  }

  // 長條圖：每個選項一列，寬度＝該選項人數 ÷ 作答人數；超過 6 個選項改矮一點的列（11 列也放得進 1080p）
  // 複選題一人可選多項，所以各列加起來會超過 100%，下面補一行說明
  function bars(q, ans) {
    const { counts, respondents } = tally(q, ans);
    const total = respondents || 1;
    const n = q.options.length;
    const list = el('div', { class: 'bars' + (n > 6 ? ' dense' : '') }, q.options.map((opt, i) => {
      const pct = Math.round(counts[i] / total * 100);
      const b = optBadge(opt, i, n);
      return el('div', { class: 'bar-row' },
        el('div', { class: 'letter', style: `background:${b.bg};color:${b.ink}` }, b.label),
        el('div', { class: 'bar-track' },
          el('div', { class: 'bar-fill', style: `width:${counts[i] ? Math.max(pct, 4) : 0}%;background:${b.bg};opacity:.45` }),
          el('div', { class: 'bar-label' }, b.label === String(opt) ? '' : opt),
        ),
        el('div', { class: 'bar-num' }, counts[i], el('small', {}, `${counts[i] ? pct : 0}%`)),
      );
    }));
    if (q.type !== 'multi') return list;
    return el('div', {}, list, el('div', { class: 'hint' }, `可複選：${respondents} 人作答，一人可以選好幾項，百分比＝選這一項的人 ÷ 作答人數`));
  }
}
</script>
</body>
</html>
