<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投影</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="screen">
<div id="app"><div class="wait">載入中…</div></div>
<script type="module">
import { createStore, qs, el, $, optBadge, joinedSeats, timerLeft, fmtTime, tally } from './store.js';
import { SETS, DEFAULT_ROOM } from './questions.js';
import { brailleChart } from './braille.js';

const app = $('#app');
// 換整個畫面；null 的要先濾掉（replaceChildren 收到 null 會印出「null」三個字）
function show(...kids) { app.replaceChildren(...kids.filter((k) => k != null)); }
const room = qs('r', DEFAULT_ROOM);
main();

async function main() {
  const store = await createStore(room);
  let state = null, answers = {}, students = {}, unsubAns = null, lastSession = null;
  let timerEl = null; // 倒數數字：每半秒就地更新，不整頁重畫
  setInterval(tick, 500);
  const base = location.href.replace(/[^/]*$/, '');
  const studentUrl = `${base}index.html${room === DEFAULT_ROOM ? '' : '?r=' + encodeURIComponent(room)}`;

  store.on('students', (s) => { students = s || {}; draw(); });
  store.on('state', (s) => {
    state = s;
    const session = s && s.session;
    if (session && session !== lastSession) {
      lastSession = session;
      if (unsubAns) unsubAns();
      unsubAns = store.on(`answers/${session}`, (a) => { answers = a || {}; draw(); });
    }
    draw();
  });

  function draw() {
    const SET = state && SETS[state.set];
    const q = SET && state.qid ? SET.questions.find((x) => x.id === state.qid) : null;
    const joinedList = state ? joinedSeats(students, state.session) : [];
    const joined = joinedList.length;

    // 待機：掃碼畫面 或 平板蓋上
    if (!q) {
      if (state && state.screen === 'cover') return drawCover(joined);
      return drawQr(joinedList, (state && state.n) || 30, SET ? SET.title : `教室 ${room}`);
    }
    if (q.type === 'slide') return drawSlide(q);

    const cur = answers[q.id] || {};
    const answered = Object.keys(cur).length;
    const pct = joined ? Math.round(answered / joined * 100) : 0;
    timerEl = state.timer ? el('div', { class: 'timer' }) : null;
    const top = el('div', { class: 'top' },
      el('div', { class: 'grow' }, el('div', { class: 'q-tag' }, q.tag || ''), el('div', { class: 'q-text' + (q.text.length > 26 ? ' long' : '') }, q.text)),
      el('div', { class: 'counter' },
        timerEl,
        el('div', {}, el('b', {}, answered), ` / ${joined} 已作答`),
        el('div', { class: 'progress' }, el('div', { class: 'fill', style: `width:${pct}%` })),
        el('div', { class: 'small-state' }, state.open ? '作答中' : '作答結束')),
    );
    tick();
    // 最下面一條指示（老婆要的：放大、上色，作答結束也一樣）
    const bar = hintbar(state.open
      ? (q.type === 'text' ? '在平板上打一句，按送出。' : q.type === 'multi' ? '可以選好幾個，點了就送出，再點一次取消。結果等老師公布。' : '在平板上選一個，點了就送出。結果等老師公布。')
      : '作答結束，眼睛看老師。', state.open);

    // 開放題：句子即時出現；老師在手機上點的那句放大在最上面
    if (q.type === 'text') {
      const items = Object.entries(cur).sort((a, b) => a[1].t - b[1].t);
      const spot = state.spot && cur[state.spot] ? cur[state.spot] : null;
      show(top,
        spot ? el('div', { class: 'spotlight' }, spot.v) : null,
        items.length
          ? el('div', { class: 'cards' }, items.map(([seat, a]) => el('div', { class: 'cardt' + (state.spot === seat ? ' spot' : '') }, a.v)))
          : el('div', { class: 'wait' }, '等大家的句子……'),
        bar);
      return;
    }

    // 選擇題：結果公布前，投影只放題目、選項和人數
    if (!state.show) {
      show(top, optionList(q), bar);
      return;
    }
    if (q.compareWith) {
      const prev = SET.questions.find((x) => x.id === q.compareWith);
      const prevAns = answers[prev.id] || {};
      show(top, el('div', { class: 'compare' },
        el('div', {}, el('h3', {}, `${prev.tag || '前'}　${Object.keys(prevAns).length} 人`), bars(prev, prevAns)),
        el('div', {}, el('h3', {}, `${q.tag || '後'}　${answered} 人`), bars(q, cur)),
      ));
      return;
    }
    show(top, bars(q, cur));
  }

  function drawQr(joinedList, n, title) {
    const set = new Set(joinedList);
    const chips = el('div', { class: 'chips big' });
    for (let s = 1; s <= n; s++) chips.append(el('span', { class: 'chip' + (set.has(String(s)) ? ' done' : '') }, s));
    show(
      el('div', { class: 'top' }, el('h1', { style: 'font-size:34px' }, title), el('div', { class: 'counter' }, el('b', {}, joinedList.length), ' 人已加入')),
      el('div', { class: 'qr-wrap' },
        el('div', { id: 'qr' }),
        el('div', {},
          el('div', { class: 'step' }, '① 平板相機對準 QR code，點出現的網址'),
          el('div', { class: 'step' }, '② 按自己的座號'),
          el('div', { class: 'step' }, '③ 座號亮了，就把平板蓋上、眼睛看老師'),
          el('div', { class: 'hint', style: 'margin-top:20px' }, '掃不了就打網址：', el('code', { style: 'font-size:22px;word-break:break-all' }, studentUrl)),
        ),
      ),
      el('div', { style: 'margin-top:32px' }, el('div', { class: 'hint', style: 'margin:0 0 10px' }, '座號亮起來＝成功加入'), chips),
      store.mode === 'local' ? el('div', { class: 'hint' }, '（本機模式）') : null,
    );
    if (window.QRCode) new QRCode($('#qr'), { text: studentUrl, width: 320, height: 320 });
  }

  function drawCover(joined) {
    show(
      el('div', { class: 'cover' }, el('div', { class: 'cover-text' }, '請把平板蓋上'), el('div', { class: 'cover-sub' }, '眼睛看老師')),
      el('div', { class: 'corner' }, el('div', { id: 'qr' }), el('div', { class: 'hint', style: 'margin-top:6px;font-size:18px' }, `${joined} 人已加入`)),
    );
    if (window.QRCode) new QRCode($('#qr'), { text: studentUrl, width: 120, height: 120 });
  }

  // 揭曉頁（點字對照表）：先放整張讓學生自己找；老師按「顯示答案」才在今天摸的那幾格加黃框，提示條變綠色
  function drawSlide(q) {
    const on = !!state.show;
    const hl = q.highlight || [];
    show(
      el('div', { class: 'top' },
        el('div', { class: 'grow' }, el('div', { class: 'q-tag' }, q.tag || ''), el('div', { class: 'q-text' }, q.text)),
        el('div', { class: 'legend' }, '一格 6 個點位：左欄 1、2、3，右欄 4、5、6', el('br'), '黑點＝凸起　空圈＝沒有')),
      brailleChart({ highlight: hl, show: on }),
      hintbar(on ? `黃框＝今天摸的三張卡：${hl.join('、')}` : '找找看，你剛剛摸到的是哪一個數字？', true, on ? ' answer' : ''),
    );
  }

  function hintbar(text, open, extra = '') { return el('div', { class: 'hintbar' + (open ? '' : ' closed') + extra }, text); }
  function tick() {
    if (!timerEl || !state || !state.timer) return;
    const left = timerLeft(state.timer);
    timerEl.textContent = left > 0 ? `⏱ ${fmtTime(left)}` : '時間到';
    timerEl.className = 'timer' + (left <= 10 ? ' urgent' : '') + (left === 0 ? ' over' : '');
  }

  function optionList(q) {
    const n = q.options.length;
    if (n > 4) return el('div', { class: 'opt-list many' }, q.options.map((opt) => el('div', { class: 'opt-big' }, opt))); // 多選項：小方塊排一排
    return el('div', { class: 'opt-list' }, q.options.map((opt, i) => { const b = optBadge(opt, i, n); return el('div', { class: 'opt-big' },
      el('span', { class: 'letter', style: `background:${b.bg};color:${b.ink}` }, b.label), el('span', {}, opt)); }));
  }

  // 長條圖：每個選項一列，寬度＝該選項人數 ÷ 作答人數；超過 6 個選項改矮一點的列（11 列也放得進 1080p）
  // 複選題一人可選多項，所以各列加起來會超過 100%，下面補一行說明
  function bars(q, ans) {
    const { counts, respondents } = tally(q, ans);
    const total = respondents || 1;
    const n = q.options.length;
    const list = el('div', { class: 'bars' + (n > 6 ? ' dense' : '') }, q.options.map((opt, i) => {
      const pct = Math.round(counts[i] / total * 100);
      const b = optBadge(opt, i, n);
      return el('div', { class: 'bar-row' },
        el('div', { class: 'letter', style: `background:${b.bg};color:${b.ink}` }, b.label),
        el('div', { class: 'bar-track' },
          el('div', { class: 'bar-fill', style: `width:${counts[i] ? Math.max(pct, 4) : 0}%;background:${b.bg};opacity:.45` }),
          el('div', { class: 'bar-label' }, b.label === String(opt) ? '' : opt),
        ),
        el('div', { class: 'bar-num' }, counts[i], el('small', {}, `${counts[i] ? pct : 0}%`)),
      );
    }));
    if (q.type !== 'multi') return list;
    return el('div', {}, list, el('div', { class: 'hint' }, `可複選：${respondents} 人作答，一人可以選好幾項，百分比＝選這一項的人 ÷ 作答人數`));
  }
}
</script>
</body>
</html>
