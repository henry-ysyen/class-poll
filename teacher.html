<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>老師遙控器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="teacher">
<div id="banner"></div>
<div id="app"><div class="wait">載入中…</div></div>
<script type="module">
import { createStore, qs, el, $, OPTION_COLORS, OPTION_INK, LETTERS, joinedSeats, timerLeft, fmtTime } from './store.js';
import { SETS, DEFAULT_ROOM, DEFAULT_N } from './questions.js';

const app = $('#app');
const room = qs('r', DEFAULT_ROOM);
const setId = qs('set', 'L2');
const N = Math.max(1, Math.min(60, +qs('n', DEFAULT_N) || DEFAULT_N));
const SET = SETS[setId];

if (!SET) {
  app.replaceChildren(el('div', { class: 'card' },
    el('h1', {}, '老師遙控器'),
    el('p', {}, `找不到題組「${setId}」。網址例如：`),
    el('code', {}, 'teacher.html?set=L2'),
    el('p', { class: 'muted small' }, `set＝題組（${Object.keys(SETS).join('、')}）；r＝教室代碼（預設 ${DEFAULT_ROOM}）；n＝座號到幾號（預設 ${DEFAULT_N}）`),
  ));
} else {
  main();
}

async function main() {
  const store = await createStore(room);
  if (store.mode === 'local') $('#banner').replaceChildren(el('div', { class: 'banner' }, '本機模式：只在這台電腦的瀏覽器分頁之間同步（試流程用）。要讓平板連進來，見 README 的上線步驟。'));

  // ---- 老師密碼（這支手機／電腦記住，下次不用再打）----
  const PIN_KEY = `classpoll:pin:${room}`;
  let pin = localStorage.getItem(PIN_KEY);
  if (!pin) {
    await new Promise((resolve) => {
      app.replaceChildren(el('div', { class: 'card' },
        el('h1', {}, `老師遙控器 · 教室 ${room}`),
        el('p', {}, '輸入老師密碼（4 個字以上）。第一個用的人設定，之後都打同一組；這台裝置會記住。'),
        el('input', { id: 'pin', type: 'password', placeholder: '老師密碼' }),
        el('div', { style: 'height:10px' }),
        el('button', { class: 'primary big', onclick: () => { const v = $('#pin').value.trim(); if (v.length >= 4) { pin = v; localStorage.setItem(PIN_KEY, v); resolve(); } } }, '進入'),
      ));
    });
  }
  // Firebase 模式：第一次用的人把密碼寫進去（規則只允許寫一次）；之後寫失敗就當作已存在
  if (store.mode === 'firebase') { try { await store.set('config/pin', pin); } catch {} }

  // ---- 狀態 ----
  // qid＝現在出的題、open＝開放作答、show＝投影顯示結果、screen＝待機時投影放什麼（qr 掃碼／cover 平板蓋上）、
  // spot＝投影放大的那一句（座號）、last＝最後出過的題（收題後「下一題」接得下去）、timer＝倒數（{secs, end}）、session＝回合
  function fresh() { return { set: setId, qid: null, open: false, show: false, screen: 'qr', spot: null, last: null, timer: null, session: String(Date.now()), n: N, at: Date.now() }; }
  let state = await store.once('state');
  if (!state || !state.session) {
    state = fresh();
    await push(state);
  } else if (state.set !== setId || state.n !== N) {
    await push({ ...state, set: setId, n: N });
  }
  async function push(next) {
    next = { ...next, at: Date.now() };
    try { await store.update('', { token: pin, state: next }); }
    catch (e) { alert('寫入失敗：老師密碼可能不對（「工具」裡有「換密碼」），或資料庫規則沒設好。\n' + e.message); throw e; }
  }

  // ---- 網址（要在訂閱之前宣告，訂閱一掛上就會畫畫面）----
  const base = location.href.replace(/[^/]*$/, '');
  const param = room === DEFAULT_ROOM ? '' : '?r=' + encodeURIComponent(room);
  const studentUrl = `${base}index.html${param}`;
  const screenUrl = `${base}screen.html${param}`;

  // ---- 操作（要在訂閱之前宣告，訂閱一掛上就會畫畫面）----
  const indexOf = (id) => SET.questions.findIndex((x) => x.id === id);
  const pos = () => (state.qid ? indexOf(state.qid) : state.last ? indexOf(state.last) : -1);
  const showQ = (q) => push({ ...state, qid: q.id, last: q.id, open: true, show: q.type === 'text', spot: null, timer: null });
  const next = () => { const q = SET.questions[pos() + 1]; if (q) showQ(q); };
  const prev = () => { const q = SET.questions[pos() - 1]; if (q) showQ(q); };
  const close = () => push({ ...state, qid: null, open: false, show: false, spot: null, timer: null, screen: 'cover' });
  const showQr = () => push({ ...state, qid: null, open: false, show: false, spot: null, timer: null, screen: 'qr' });
  const startTimer = (secs) => push({ ...state, timer: { secs, end: Date.now() + secs * 1000 } });
  const stopTimer = () => push({ ...state, timer: null });

  let answers = {}, students = {}, unsubAns = null;
  let ui = {}; // 每半秒就地更新的元件（倒數數字），不整頁重畫
  const wide = window.matchMedia('(min-width: 960px)').matches; // 筆電：兩欄，連線區預設打開
  const opened = { list: true, link: wide, tools: false }; // 摺疊區開關（重畫時保留）
  setInterval(tick, 500);
  store.on('students', (s) => { students = s || {}; draw(); });
  store.on('state', (s) => {
    if (!s) return;
    const sessionChanged = !state || s.session !== state.session;
    state = s;
    if (sessionChanged || !unsubAns) {
      if (unsubAns) unsubAns();
      unsubAns = store.on(`answers/${state.session}`, (a) => { answers = a || {}; draw(); });
    }
    draw();
  });

  function draw() {
    const i = state.qid ? indexOf(state.qid) : -1;
    const q = i >= 0 ? SET.questions[i] : null;
    const nextQ = SET.questions[pos() + 1] || null;
    const cur = q ? (answers[q.id] || {}) : {};
    const answered = Object.keys(cur).length;
    const joinedList = joinedSeats(students, state.session);
    const joined = joinedList.length;

    // 標題列
    // 題組下拉選單：換一節課不用改網址（選了就重新載入，投影與學生畫面會跟著換）
    const setPick = el('select', { class: 'setpick', onchange: (e) => { const u = new URL(location.href); u.searchParams.set('set', e.target.value); location.href = u.toString(); } },
      Object.entries(SETS).map(([id, s]) => el('option', { value: id, selected: id === setId ? 'selected' : null }, s.title)));
    const bar = el('div', { class: 'topbar' },
      el('div', { class: 'grow' },
        el('div', { class: 'row', style: 'gap:6px' }, el('span', { class: 'muted small' }, '題組'), setPick),
        el('div', { class: 'muted small' }, `教室 ${room}　座號 1～${N}　`, el('span', { class: 'pill' }, `${joined} 人已加入`))),
    );

    // 現在這題 ＋ 遙控按鈕
    let now;
    ui = {};
    if (!q) {
      const cover = state.screen === 'cover';
      now = el('div', { class: 'card now' },
        el('div', { class: 'q-tag' }, '待機中'),
        el('div', { class: 'q-text' }, cover ? '投影幕：請把平板蓋上' : '投影幕：QR CODE（掃碼加入）'),
        el('div', { class: 'row btns' },
          el('button', { class: 'primary big grow', disabled: nextQ ? null : 'disabled', onclick: next }, nextQ ? `▶ ${pos() < 0 ? '出第 1 題' : '下一題'}：${nextQ.tag || nextQ.text}` : '題目出完了'),
        ),
        el('div', { class: 'row', style: 'margin-top:8px' },
          cover ? el('button', { class: 'small', onclick: showQr }, '投影：顯示 QR CODE') : el('button', { class: 'small', onclick: close }, '投影：平板蓋上'),
          pos() >= 0 ? el('button', { class: 'small', onclick: () => showQ(SET.questions[pos()]) }, `◀ 回到剛才那題`) : null,
        ),
      );
    } else {
      const pct = joined ? Math.round(answered / joined * 100) : 0;
      // 按鈕順序照老婆定的：出題 → 關閉作答 → 顯示結果 → 下一題；輪到哪一步，那顆就亮黃色
      const step = state.open ? 'close' : (q.type === 'choice' && !state.show) ? 'show' : 'next';
      now = el('div', { class: 'card now' },
        el('div', { class: 'row', style: 'gap:6px' },
          el('div', { class: 'q-tag', style: 'margin-right:4px' }, `第 ${i + 1}／${SET.questions.length} 題　${q.tag || ''}`),
          el('span', { class: 'pill ' + (state.open ? 'on' : 'off') }, state.open ? '作答中' : '已關閉'),
          q.type === 'choice'
            ? el('span', { class: 'pill ' + (state.show ? 'on' : 'off') }, state.show ? '投影：顯示結果' : '投影：只顯示人數')
            : el('span', { class: 'pill on' }, '投影：句子即時出現'),
        ),
        el('div', { class: 'q-text' }, q.text),
        el('div', { class: 'count' }, el('b', {}, answered), ` / ${joined} 已作答`),
        el('div', { class: 'progress' }, el('div', { class: 'fill', style: `width:${pct}%` })),
        timerRow(),
        el('div', { class: 'row btns' },
          el('button', { class: 'big grow' + (step === 'close' ? ' accent' : ''), onclick: () => push({ ...state, open: !state.open, timer: state.open ? null : state.timer }) }, state.open ? '關閉作答' : '開放作答'),
          q.type === 'choice' ? el('button', { class: 'big grow' + (step === 'show' ? ' accent' : ''), onclick: () => push({ ...state, show: !state.show }) }, state.show ? '隱藏結果' : '顯示結果') : null,
        ),
        el('div', { class: 'row btns' },
          el('button', { class: 'primary big grow', disabled: nextQ ? null : 'disabled', onclick: next }, nextQ ? `▶ 下一題：${nextQ.tag || nextQ.text}` : '已是最後一題'),
        ),
        el('div', { class: 'row', style: 'margin-top:8px' },
          el('button', { class: 'small', disabled: i > 0 ? null : 'disabled', onclick: prev }, '◀ 上一題'),
          el('button', { class: 'small', onclick: close }, '收題（投影：平板蓋上）'),
        ),
        chips(cur, joinedList),
        q.type === 'choice' ? miniBars(q, cur) : sentences(q, cur),
      );
    }

    // 題目清單（跳題用）
    const tbl = el('div', { class: 'qlist' });
    SET.questions.forEach((x, k) => {
      const n = Object.keys(answers[x.id] || {}).length;
      const isCur = !!(q && q.id === x.id);
      tbl.append(el('div', { class: 'qrow' + (isCur ? ' cur' : '') },
        el('div', { class: 'qn' }, k + 1),
        el('div', { class: 'grow' },
          el('div', { class: 'muted small' }, (x.tag || '') + (x.type === 'text' ? '（開放題）' : '') + (n ? `　${n} 人答過` : '')),
          el('div', {}, x.text)),
        el('button', { class: isCur ? 'small' : 'small primary', disabled: isCur ? 'disabled' : null, onclick: () => showQ(x) }, isCur ? '出題中' : '出這題'),
      ));
    });
    const list = section('list', '題目清單（跳題用）', tbl);

    // 連線
    const link = section('link', '連線：QR code、網址、投影頁',
      el('div', { class: 'row', style: 'margin-top:10px;align-items:flex-start' },
        el('div', { id: 'qr' }),
        el('div', { class: 'grow' },
          el('div', {}, '學生頁：', el('code', { style: 'user-select:all;word-break:break-all' }, studentUrl)),
          el('div', { style: 'margin-top:8px' }, el('a', { href: screenUrl, target: '_blank' }, '開投影頁（另開分頁，拖到投影機那個螢幕）')),
          el('div', { class: 'muted small', style: 'margin-top:8px' }, '已加入的座號：', joinedList.join('、') || '（還沒有人）'),
        )),
    );

    // 工具
    const tools = section('tools', '工具：匯出、新回合、換密碼',
      el('div', { class: 'row', style: 'margin-top:10px' },
        el('button', { onclick: exportCsv }, '匯出這回合的答案（CSV）'),
        el('button', { onclick: exportOld }, '匯出以前的回合…'),
        el('button', { class: 'danger', onclick: () => { if (confirm('開新回合：投影與計數歸零（舊答案還在資料庫，匯出時還拿得到）；學生平板不用重掃。試教完、正式上課前按。確定？')) push(fresh()); } }, '新回合'),
        el('button', { onclick: () => { localStorage.removeItem(PIN_KEY); location.reload(); } }, '換密碼'),
        el('span', { class: 'muted small' }, `回合 ${state.session}`),
      ));

    app.replaceChildren(bar, el('div', { class: 'cols' }, el('div', { class: 'col' }, now), el('div', { class: 'col' }, list, link, tools)));
    if (window.QRCode) new QRCode($('#qr'), { text: studentUrl, width: 140, height: 140 });
  }

  // 倒數：沒開 → 1／2／3 分三顆；開了 → 剩幾秒＋停止（數字由 tick 每半秒就地更新）
  function timerRow() {
    if (!state.timer) {
      return el('div', { class: 'row timer-row' }, el('span', { class: 'muted small' }, '⏱ 投影倒數'),
        [1, 2, 3].map((m) => el('button', { class: 'small', onclick: () => startTimer(m * 60) }, `${m} 分`)));
    }
    ui.timer = el('span', { class: 'timer' });
    const row = el('div', { class: 'row timer-row' }, ui.timer, el('button', { class: 'small', onclick: stopTimer }, timerLeft(state.timer) > 0 ? '停止倒數' : '清掉'));
    tick();
    return row;
  }
  function tick() {
    if (!ui.timer || !state || !state.timer) return;
    const left = timerLeft(state.timer);
    ui.timer.textContent = left > 0 ? `⏱ ${fmtTime(left)}` : '⏱ 時間到（投影在閃）';
    ui.timer.className = 'timer' + (left <= 10 ? ' urgent' : '') + (left === 0 ? ' over' : '');
  }

  function section(key, title, ...kids) {
    const d = el('details', { class: 'card' }, el('summary', {}, title), ...kids);
    if (opened[key]) d.setAttribute('open', '');
    d.addEventListener('toggle', () => { opened[key] = d.open; });
    return d;
  }
  function chips(cur, joinedList) {
    const joined = new Set(joinedList);
    const c = el('div', { class: 'chips' });
    for (let s = 1; s <= N; s++) {
      const k = String(s);
      c.append(el('span', { class: 'chip' + (cur[k] ? ' done' : joined.has(k) ? ' in' : '') }, s));
    }
    return el('div', { style: 'margin-top:12px' }, c, el('div', { class: 'muted small', style: 'margin-top:4px' }, '綠＝答了　白＝加入了還沒答　灰＝沒加入'));
  }
  function miniBars(q, cur) {
    const counts = q.options.map(() => 0);
    for (const a of Object.values(cur)) if (typeof a.i === 'number' && counts[a.i] !== undefined) counts[a.i]++;
    const total = Math.max(1, counts.reduce((s, c) => s + c, 0));
    return el('div', { class: 'mini' },
      el('div', { class: 'muted small' }, '分布（只有你看得到；投影要按「顯示結果」才出長條圖）'),
      q.options.map((opt, i) => el('div', { class: 'mini-row' },
        el('span', { class: 'letter', style: `background:${OPTION_COLORS[i]};color:${OPTION_INK[i]}` }, LETTERS[i]),
        el('div', { class: 'mini-track' }, el('div', { class: 'mini-fill', style: `width:${Math.round(counts[i] / total * 100)}%;background:${OPTION_COLORS[i]}` }), el('span', { class: 'mini-label' }, opt)),
        el('b', {}, counts[i]))));
  }
  function sentences(q, cur) {
    const items = Object.entries(cur).sort((a, b) => a[1].t - b[1].t);
    const hint = el('div', { class: 'muted small' }, items.length ? '點一句 → 投影幕放大那句（再點一次取消）。座號只有你看得到。' : '句子送進來會列在這裡（附座號）。點一句，投影幕就放大那句。');
    return el('div', { class: 'mini' }, hint,
      items.map(([seat, a]) => el('div', { class: 'sent' + (state.spot === seat ? ' spot' : ''), onclick: () => push({ ...state, spot: state.spot === seat ? null : seat }) },
        el('span', { class: 'seat-no' }, seat), el('span', {}, a.v))));
  }

  // 匯出：這回合（畫面上的）或以前的回合。題目從所有題組找（舊回合可能是別的題組，例如 11/12 的 L1、11/18 的 L2）。
  // 用 function 宣告（不用 const），因為 draw() 在訂閱一掛上就會跑、會用到 exportCsv／exportOld。
  function exportCsv() { downloadCsv(state.session, answers); }
  async function exportOld() {
    const all = (await store.once('answers')) || {};
    const sessions = Object.keys(all).filter((s) => s !== state.session).sort((a, b) => +b - +a);
    if (!sessions.length) { alert('資料庫裡沒有以前的回合。'); return; }
    const list = sessions.map((s, i) => `${i + 1}. ${fmtSession(s)}　${Object.keys(all[s]).length} 題有答案`).join('\n');
    const pick = prompt('要匯出哪一個回合？輸入編號：\n' + list, '1');
    const s = sessions[(+pick) - 1];
    if (s) downloadCsv(s, all[s]);
  }
  function fmtSession(s) { return isFinite(+s) ? new Date(+s).toLocaleString('zh-TW') : s; }
  function findAny(qid) { for (const [sid, set] of Object.entries(SETS)) { const q = set.questions.find((x) => x.id === qid); if (q) return { sid, q }; } return { sid: '', q: null }; }
  function downloadCsv(session, ans) {
    const rows = [['回合', '回合時間', '題組', '題號', '段落', '題目', '座號', '答案', '時間']];
    const order = Object.values(SETS).flatMap((set) => set.questions.map((x) => x.id)); // 題目照題組順序；題庫裡已沒有的排最後
    const qids = Object.keys(ans || {}).sort((a, b) => { const ia = order.indexOf(a), ib = order.indexOf(b); return (ia < 0 ? 1e9 : ia) - (ib < 0 ? 1e9 : ib); });
    let sid = '';
    for (const qid of qids) {
      const f = findAny(qid); sid = sid || f.sid;
      const a = ans[qid] || {};
      for (const seat of Object.keys(a).sort((p, q) => +p - +q)) {
        rows.push([session, fmtSession(session), f.sid, qid, f.q ? f.q.tag || '' : '', f.q ? f.q.text : '（題庫裡已沒有這題）', seat, a[seat].v, new Date(a[seat].t).toLocaleString('zh-TW')]);
      }
    }
    const fileSet = sid || setId;
    const csv = '﻿' + rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const a = el('a', { href: URL.createObjectURL(blob), download: `classpoll_${room}_${fileSet}_${session}.csv` });
    document.body.append(a); a.click(); a.remove();
  }
}
</script>
</body>
</html>
