<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課堂問卷</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body class="student">
<div id="banner"></div>
<div id="app"><div class="wait">載入中…</div></div>
<script type="module">
import { createStore, qs, el, $, optBadge } from './store.js';
import { findQuestion, DEFAULT_ROOM, DEFAULT_N } from './questions.js';

const app = $('#app');
const room = qs('r', DEFAULT_ROOM);
main();

async function main() {
  const store = await createStore(room);
  if (store.mode === 'local') $('#banner').replaceChildren(el('div', { class: 'banner' }, '本機模式：只在這台電腦的瀏覽器分頁之間同步（試流程用）'));

  // 座號跟「回合編號」一起記在平板上：老師按新回合，平板一看到回合變了就放掉座號、回到選座號畫面
  // （平板是全班共用的，座號黏在平板上會讓下一個拿到的人頂著別人的座號；11/10 老婆到校實測後 Henry 回報）
  const SEAT_KEY = `classpoll:seat:${room}`;
  let seat = null, seatSession = null;
  try { const j = JSON.parse(localStorage.getItem(SEAT_KEY) || 'null'); if (j && j.seat) { seat = String(j.seat); seatSession = j.session || null; } } catch {}
  const saveSeat = () => { if (seat) localStorage.setItem(SEAT_KEY, JSON.stringify({ seat, session: seatSession })); else localStorage.removeItem(SEAT_KEY); };
  let state = null, students = {}, lastSession = null;
  let unsubAns = null, myAns = null, lastKey = '', lastDraw = '', draft = '';
  let ui = {}; // 畫面上要「就地更新」的元件（不整個重畫，打字中才不會被打斷）
  // 下面三個要在訂閱之前宣告，訂閱一掛上就會畫畫面
  const N = () => Math.max(1, Math.min(60, (state && state.n) || +qs('n', DEFAULT_N) || DEFAULT_N));
  function checkIn() { store.set(`students/${seat}`, { t: Date.now(), s: state ? state.session : null }); }
  function render() { seat ? showQuestion() : pickSeat(); }

  store.on('students', (s) => { students = s || {}; if (!seat) render(); });
  store.on('state', (s) => {
    state = s;
    const S = s && s.session;
    if (seat && S) {
      if (seatSession && seatSession !== S) {
        // 老師開了新回合 → 放掉座號，回到選座號（不用重掃，網頁還開著）
        seat = null; seatSession = null; saveSeat(); lastDraw = '';
        if (unsubAns) { unsubAns(); unsubAns = null; myAns = null; lastKey = ''; }
      } else if (seatSession !== S) {
        seatSession = S; saveSeat(); checkIn(); // 選座號時還沒拿到回合編號 → 現在補記、報到
      } else if (S !== lastSession) {
        checkIn(); // 重新整理後第一次拿到狀態 → 報到一次
      }
    }
    lastSession = S || null;
    render();
  });

  // ---- 選座號 ----
  function pickSeat() {
    const n = N(), session = state && state.session;
    const grid = el('div', { class: 'seat-grid' });
    for (let i = 1; i <= n; i++) {
      const st = students[String(i)];
      const taken = !!(st && session && st.s === session);
      grid.append(el('button', { class: taken ? 'taken' : '', onclick: () => {
        seat = String(i); seatSession = session || null; saveSeat();
        lastSession = session || null; checkIn(); lastDraw = ''; render();
      } }, i));
    }
    app.replaceChildren(el('div', { class: 'card' },
      el('h1', {}, '你的座號是幾號？'),
      el('p', { class: 'muted small' }, `教室 ${room}　灰色＝已經有人按了`),
      grid,
    ));
  }

  // ---- 看題、作答 ----
  function head() {
    return el('div', { class: 'row head' },
      el('div', { class: 'grow' }, el('span', { class: 'seat-badge' }, seat), el('span', { class: 'muted small' }, ` 號　教室 ${room}`)),
      el('button', { class: 'small', onclick: () => { seat = null; seatSession = null; saveSeat(); location.reload(); } }, '換座號'),
    );
  }
  function showQuestion() {
    const q = state && state.qid ? findQuestion(state.set, state.qid) : null;
    const slide = !!(q && q.type === 'slide'); // 投影頁（例如點字對照表揭曉）：平板不作答，只叫學生看投影幕
    if (!q || slide) {
      if (unsubAns) { unsubAns(); unsubAns = null; myAns = null; lastKey = ''; }
      const cover = !!(state && state.screen === 'cover');
      const key = `idle|${cover}|${slide ? q.id : ''}`;
      if (key === lastDraw) return;
      lastDraw = key;
      app.replaceChildren(head(), el('div', { class: 'card idle' },
        el('div', { class: 'big-seat' }, seat),
        el('div', { class: 'idle-text' }, slide ? '眼睛看投影幕' : cover ? '請把平板蓋上' : '已加入 ✓'),
        el('div', { class: 'muted', style: 'font-size:22px' }, slide ? (q.student || '') : cover ? '眼睛看老師' : '請把平板蓋上，眼睛看老師'),
      ));
      return;
    }
    const key = `answers/${state.session}/${q.id}/${seat}`;
    if (key !== lastKey) {
      if (unsubAns) unsubAns();
      lastKey = key; myAns = null; draft = ''; lastDraw = '';
      unsubAns = store.on(key, (a) => { myAns = a; draw(q, key); });
      return; // 訂閱時會立刻回呼一次，由 draw 畫
    }
    draw(q, key);
  }

  function draw(q, key) {
    const open = !!state.open;
    const drawKey = `${key}|${open}`;
    if (drawKey === lastDraw) return patch(q, open); // 題目與開關都沒變：只更新「已送出」那幾個字
    lastDraw = drawKey;
    ui = {};
    const card = el('div', { class: 'card' },
      q.tag ? el('div', { class: 'q-tag' }, q.tag) : null,
      el('div', { class: 'q-text' }, q.text),
    );
    if (q.type === 'choice' || q.type === 'multi') {
      // 4 個以內：一列一個，帶 A～D 色標；超過 4 個（0～9＋摸不出來）：格子排，短的一格、長的跨整列
      // 複選（multi）：點一個存一個、再點一次取消，全部取消就把答案拿掉；存 is＝選到的編號、v＝選項文字用「、」接起來（匯出 CSV 看得懂）
      const n = q.options.length, grid = n > 4, multi = q.type === 'multi';
      const pickMulti = (i) => {
        const cur = new Set(myAns && Array.isArray(myAns.is) ? myAns.is : []);
        if (cur.has(i)) cur.delete(i); else cur.add(i);
        const is = [...cur].sort((a, b) => a - b);
        if (!is.length) return store.remove(key);
        store.set(key, { v: is.map((k) => q.options[k]).join('、'), is, t: Date.now() });
      };
      ui.opts = q.options.map((opt, i) => {
        const b = optBadge(opt, i, n);
        return el('button', {
          class: 'opt' + (grid ? (String(opt).length <= 2 ? ' cell' : ' cell wide') : ''), disabled: open ? null : 'disabled',
          onclick: () => (multi ? pickMulti(i) : store.set(key, { v: opt, i, t: Date.now() })),
        }, grid ? el('span', {}, opt) : [el('span', { class: 'letter', style: `background:${b.bg};color:${b.ink}` }, b.label), el('span', { class: 'grow' }, opt), multi ? el('span', { class: 'tick' }) : null]);
      });
      card.append(...(grid ? [el('div', { class: 'opt-grid' }, ui.opts)] : ui.opts));
      ui.status = el('div', { class: 'status muted' });
      card.append(ui.status);
    } else {
      const input = el('input', { type: 'text', maxlength: '60', placeholder: '打一句，按送出', enterkeyhint: 'send', autocomplete: 'off' });
      input.value = draft || (myAns && myAns.v ? strip(q, myAns.v) : '');
      if (!open) input.disabled = true;
      input.addEventListener('input', () => { draft = input.value; });
      // 學生自己又打了句首（例如「因為」「我聽到」）就先拿掉，免得變成「因為因為…」
      const send = () => { let t = input.value.trim(); if (q.prefix && t.startsWith(q.prefix)) t = t.slice(q.prefix.length).trim(); if (!t) return; store.set(key, { v: (q.prefix + t).slice(0, 200), t: Date.now() }); };
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); send(); } });
      ui.send = el('button', { class: 'primary big', style: 'width:100%', disabled: open ? null : 'disabled', onclick: send }, '送出');
      ui.status = el('div', { class: 'status muted' });
      card.append(el('div', { class: 'prefix' }, q.prefix + '……'), input, el('div', { style: 'height:10px' }), ui.send, ui.status);
    }
    app.replaceChildren(head(), card);
    patch(q, open);
  }
  function strip(q, v) { return q.prefix && v.startsWith(q.prefix) ? v.slice(q.prefix.length) : v; }
  function patch(q, open) {
    const answered = !!(myAns && myAns.v);
    const picked = myAns && Array.isArray(myAns.is) ? myAns.is : [];
    if (ui.opts) ui.opts.forEach((b, i) => {
      const sel = q.type === 'multi' ? picked.includes(i) : !!(myAns && myAns.i === i);
      b.classList.toggle('sel', sel);
      const t = b.querySelector('.tick'); if (t) t.textContent = sel ? '✓' : '';
    });
    if (ui.send) ui.send.textContent = answered ? '再送一次（改句子）' : '送出';
    if (!ui.status) return;
    ui.status.className = 'status ' + (answered ? 'ok' : 'muted');
    if (!open) ui.status.textContent = answered ? '已送出 ✓　作答已結束' : '作答已結束';
    else if (answered) ui.status.textContent = q.type === 'choice' ? '已送出 ✓　還可以改' : q.type === 'multi' ? `已選 ${picked.length} 個 ✓　還可以再點，再點一次取消` : `已送出 ✓　「${myAns.v}」`;
    else ui.status.textContent = q.type === 'choice' ? '請選一個，點了就送出' : q.type === 'multi' ? '可以選好幾個，點了就送出' : '打一句，按送出';
  }
}
</script>
</body>
</html>
