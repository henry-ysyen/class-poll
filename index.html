<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課堂問卷</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body class="student">
<div id="banner"></div>
<div id="app"><div class="wait">載入中…</div></div>
<script type="module">
import { createStore, qs, el, $, OPTION_COLORS, OPTION_INK, LETTERS } from './store.js';
import { findQuestion, DEFAULT_ROOM, DEFAULT_N } from './questions.js';

const app = $('#app');
const room = qs('r', DEFAULT_ROOM);
main();

async function main() {
  const store = await createStore(room);
  if (store.mode === 'local') $('#banner').replaceChildren(el('div', { class: 'banner' }, '本機模式：只在這台電腦的瀏覽器分頁之間同步（試流程用）'));

  const SEAT_KEY = `classpoll:seat:${room}`;
  let seat = localStorage.getItem(SEAT_KEY);
  let state = null, students = {}, lastSession = null;
  let unsubAns = null, myAns = null, lastKey = '', lastDraw = '', draft = '';
  let ui = {}; // 畫面上要「就地更新」的元件（不整個重畫，打字中才不會被打斷）
  // 下面三個要在訂閱之前宣告，訂閱一掛上就會畫畫面
  const N = () => Math.max(1, Math.min(60, (state && state.n) || +qs('n', DEFAULT_N) || DEFAULT_N));
  function checkIn() { store.set(`students/${seat}`, { t: Date.now(), s: state ? state.session : null }); }
  function render() { seat ? showQuestion() : pickSeat(); }

  store.on('students', (s) => { students = s || {}; if (!seat) render(); });
  store.on('state', (s) => {
    state = s;
    // 老師開新回合 → 自動重新報到，老師頁的「已加入」才算得到這一回合的人（學生不用重掃）
    if (seat && s && s.session !== lastSession) { lastSession = s.session; checkIn(); }
    render();
  });

  // ---- 選座號 ----
  function pickSeat() {
    const n = N(), session = state && state.session;
    const grid = el('div', { class: 'seat-grid' });
    for (let i = 1; i <= n; i++) {
      const st = students[String(i)];
      const taken = !!(st && session && st.s === session);
      grid.append(el('button', { class: taken ? 'taken' : '', onclick: () => {
        seat = String(i); localStorage.setItem(SEAT_KEY, seat);
        lastSession = session || null; checkIn(); lastDraw = ''; render();
      } }, i));
    }
    app.replaceChildren(el('div', { class: 'card' },
      el('h1', {}, '你的座號是幾號？'),
      el('p', { class: 'muted small' }, `教室 ${room}　灰色＝已經有人按了`),
      grid,
    ));
  }

  // ---- 看題、作答 ----
  function head() {
    return el('div', { class: 'row head' },
      el('div', { class: 'grow' }, el('span', { class: 'seat-badge' }, seat), el('span', { class: 'muted small' }, ` 號　教室 ${room}`)),
      el('button', { class: 'small', onclick: () => { localStorage.removeItem(SEAT_KEY); location.reload(); } }, '換座號'),
    );
  }
  function showQuestion() {
    const q = state && state.qid ? findQuestion(state.set, state.qid) : null;
    if (!q) {
      if (unsubAns) { unsubAns(); unsubAns = null; myAns = null; lastKey = ''; }
      const cover = !!(state && state.screen === 'cover');
      const key = `idle|${cover}`;
      if (key === lastDraw) return;
      lastDraw = key;
      app.replaceChildren(head(), el('div', { class: 'card idle' },
        el('div', { class: 'big-seat' }, seat),
        el('div', { class: 'idle-text' }, cover ? '請把平板蓋上' : '已加入 ✓'),
        el('div', { class: 'muted', style: 'font-size:22px' }, cover ? '眼睛看老師' : '請把平板蓋上，眼睛看老師'),
      ));
      return;
    }
    const key = `answers/${state.session}/${q.id}/${seat}`;
    if (key !== lastKey) {
      if (unsubAns) unsubAns();
      lastKey = key; myAns = null; draft = ''; lastDraw = '';
      unsubAns = store.on(key, (a) => { myAns = a; draw(q, key); });
      return; // 訂閱時會立刻回呼一次，由 draw 畫
    }
    draw(q, key);
  }

  function draw(q, key) {
    const open = !!state.open;
    const drawKey = `${key}|${open}`;
    if (drawKey === lastDraw) return patch(q, open); // 題目與開關都沒變：只更新「已送出」那幾個字
    lastDraw = drawKey;
    ui = {};
    const card = el('div', { class: 'card' },
      q.tag ? el('div', { class: 'q-tag' }, q.tag) : null,
      el('div', { class: 'q-text' }, q.text),
    );
    if (q.type === 'choice') {
      ui.opts = q.options.map((opt, i) => el('button', {
        class: 'opt', disabled: open ? null : 'disabled',
        onclick: () => store.set(key, { v: opt, i, t: Date.now() }),
      }, el('span', { class: 'letter', style: `background:${OPTION_COLORS[i]};color:${OPTION_INK[i]}` }, LETTERS[i]), el('span', {}, opt)));
      card.append(...ui.opts);
      ui.status = el('div', { class: 'status muted' });
      card.append(ui.status);
    } else {
      const input = el('input', { type: 'text', maxlength: '60', placeholder: '打一句，按送出', enterkeyhint: 'send', autocomplete: 'off' });
      input.value = draft || (myAns && myAns.v ? strip(q, myAns.v) : '');
      if (!open) input.disabled = true;
      input.addEventListener('input', () => { draft = input.value; });
      const send = () => { const t = input.value.trim(); if (!t) return; store.set(key, { v: (q.prefix + t).slice(0, 200), t: Date.now() }); };
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); send(); } });
      ui.send = el('button', { class: 'primary big', style: 'width:100%', disabled: open ? null : 'disabled', onclick: send }, '送出');
      ui.status = el('div', { class: 'status muted' });
      card.append(el('div', { class: 'prefix' }, q.prefix + '……'), input, el('div', { style: 'height:10px' }), ui.send, ui.status);
    }
    app.replaceChildren(head(), card);
    patch(q, open);
  }
  function strip(q, v) { return q.prefix && v.startsWith(q.prefix) ? v.slice(q.prefix.length) : v; }
  function patch(q, open) {
    const answered = !!(myAns && myAns.v);
    if (ui.opts) ui.opts.forEach((b, i) => b.classList.toggle('sel', !!(myAns && myAns.i === i)));
    if (ui.send) ui.send.textContent = answered ? '再送一次（改句子）' : '送出';
    if (!ui.status) return;
    ui.status.className = 'status ' + (answered ? 'ok' : 'muted');
    if (!open) ui.status.textContent = answered ? '已送出 ✓　作答已結束' : '作答已結束';
    else if (answered) ui.status.textContent = q.type === 'choice' ? '已送出 ✓　還可以改' : `已送出 ✓　「${myAns.v}」`;
    else ui.status.textContent = q.type === 'choice' ? '請選一個，點了就送出' : '打一句，按送出';
  }
}
</script>
</body>
</html>
